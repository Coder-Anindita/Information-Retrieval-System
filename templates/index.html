<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Retrieval System</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; color: #1f2937;
         background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #ecfeff 100%);
         display: flex; justify-content: center; align-items: flex-start; padding: 56px 16px; }
  .card { width: 100%; max-width: 760px; background: #fff; border-radius: 18px; overflow: hidden;
          box-shadow: 0 20px 50px rgba(79,70,229,.12); }
  header { padding: 28px 30px 24px; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .3px; }
  header p { margin: 6px 0 16px; opacity: .85; font-size: .92rem; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.18); padding: 5px 12px; border-radius: 999px; font-size: .8rem; }
  main { padding: 26px 30px 30px; }
  form { display: flex; gap: 10px; }
  .box { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1.5px solid #e5e7eb;
         border-radius: 12px; transition: .2s; }
  .box:focus-within { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
  .box svg { flex: none; color: #9ca3af; }
  input { flex: 1; min-width: 0; padding: 13px 0; border: 0; outline: none; font-size: 1rem; background: none; }
  button { padding: 0 26px; border: 0; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 600;
           cursor: pointer; background: linear-gradient(135deg, #4f46e5, #7c3aed); transition: .2s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(79,70,229,.3); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; align-items: center; }
  .chips span { font-size: .8rem; color: #6b7280; }
  .chip { padding: 5px 12px; border-radius: 999px; background: #f3f4f6; color: #4338ca; font-size: .82rem;
          border: 1px solid #e0e7ff; cursor: pointer; transition: .15s; }
  .chip:hover { background: #e0e7ff; }
  label { display: block; font-size: .8rem; font-weight: 600; color: #6b7280; text-transform: uppercase;
          letter-spacing: .6px; margin-bottom: 8px; }
  textarea { width: 100%; height: 360px; padding: 16px; border: 1.5px solid #e5e7eb; border-radius: 12px;
             background: #f9fafb; color: #111827; font: .88rem/1.6 Consolas, ui-monospace, monospace;
             resize: vertical; outline: none; }
  footer { text-align: center; font-size: .78rem; color: #9ca3af; padding-top: 14px; }
  @media (max-width: 520px) { form { flex-direction: column; } button { padding: 13px; } }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>Document Retrieval System</h1>
    <p>Boolean search with wildcard support over an inverted index</p>
    <div class="stats">
      <div class="stat">📄 {{ n }} documents</div>
      <div class="stat">🔤 {{ v }} terms</div>
      <div class="stat">⚙️ AND · OR · NOT · *</div>
    </div>
  </header>
  <main>
    <form method="post" id="f">
      <div class="box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input name="query" id="q" value="{{ query }}" placeholder="Search documents..." autocomplete="off" autofocus>
      </div>
      <button type="submit">Search</button>
    </form>
    <div class="chips">
      <span>Try:</span>
      <a class="chip">retrieval</a>
      <a class="chip">comp*</a>
      <a class="chip">*tion</a>
      <a class="chip">search OR crawler</a>
      <a class="chip">index AND NOT wildcard</a>
    </div>
    <label for="r">Results</label>
    <textarea id="r" readonly placeholder="Results will appear here...">{{ output }}</textarea>
    <footer>WSM Assignment</footer>
  </main>
</div>
<script>
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    document.getElementById("q").value = c.textContent;
    document.getElementById("f").submit();
  });
</script>
</body>
</html>
